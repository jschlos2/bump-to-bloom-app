<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>BumpToBloom — Your Parenting Companion</title>
<style>
:root{--sage:#3F6D4E;--sage-dark:#2E5238;--sage-light:#E7F0E9;--gold:#EFA65D;--blush:#F6DCD9;--blush-dark:#8A4B45;--ink:#2B3A2F;--muted:#6B7A70;--bg:#FFFBF6;--line:#EFE4D9;--sand:#B8A99C;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
.font-display{font-family:Georgia,'Times New Roman',serif;}
::-webkit-scrollbar{display:none;}
*{scrollbar-width:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input{font-family:inherit;}
.fade-up{animation:fadeUp .35s ease-out;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.app-shell{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 60px rgba(63,109,78,0.08);position:relative;}

.header{position:sticky;top:0;z-index:30;background:rgba(255,251,246,.95);backdrop-filter:blur(4px);padding:20px 20px 12px;border-bottom:1px solid var(--line);}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;}
.brand{display:flex;align-items:center;gap:8px;}
.brand-logo{font-size:24px;}
.brand-name{font-family:Georgia,serif;font-weight:600;font-size:18px;color:var(--sage-dark);}
.stage-btn{font-size:12px;font-weight:800;padding:6px 12px;border-radius:999px;background:var(--sage-light);color:var(--sage-dark);white-space:nowrap;}
.progress-track{width:100%;height:6px;border-radius:999px;background:var(--sage-light);overflow:hidden;}
.progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--sage),var(--gold));transition:width .3s;}

.bottom-nav{position:sticky;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:8px;display:flex;justify-content:space-between;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;}
.nav-btn.active{background:var(--sage-light);}
.nav-icon{font-size:18px;}
.nav-label{font-size:10px;font-weight:800;color:var(--muted);}
.nav-btn.active .nav-label{color:var(--sage-dark);}

.tab-body{flex:1;}
.section{padding:20px;display:flex;flex-direction:column;gap:16px;}

.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid var(--line);}
.hero-card{border-radius:24px;padding:20px;color:#fff;background:linear-gradient(135deg,var(--sage),var(--sage-dark));}
.hero-kicker{font-size:11px;font-weight:800;opacity:.8;margin:0 0 4px;}
.hero-big{font-family:Georgia,serif;font-size:30px;font-weight:600;margin:0 0 4px;}
.hero-sub{font-size:14px;opacity:.9;margin:0;}

.badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--blush);color:var(--blush-dark);}
.card-title{font-weight:800;font-size:15px;margin:8px 0 4px;color:var(--ink);}
.card-body{font-size:14px;line-height:1.6;color:var(--muted);margin:0;}
.link-btn{font-size:12px;font-weight:800;color:var(--sage);margin-top:10px;display:inline-block;}

.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.quick-btn{background:#fff;border-radius:16px;padding:12px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid var(--line);}
.quick-emoji{font-size:20px;margin-bottom:4px;}
.quick-label{font-size:11px;font-weight:800;color:var(--ink);}

.ask-cta{border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center;background:var(--gold);text-align:left;width:100%;}
.ask-cta-title{display:block;font-weight:800;color:#fff;font-size:14px;}
.ask-cta-sub{display:block;color:rgba(255,255,255,.9);font-size:12px;}
.health-cta{background:#D97363;}

.topic-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.topic-btn{background:#fff;border-radius:16px;padding:16px 10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid var(--line);}
.topic-emoji{font-size:26px;margin-bottom:6px;}
.topic-name{font-size:12px;font-weight:800;color:var(--ink);line-height:1.3;}

.emergency-banner{border-radius:16px;padding:14px 16px;background:#FBE3E1;border:1px solid #F3B4AF;color:#9B2C2C;font-size:13px;font-weight:700;line-height:1.5;}

.field-row-label{font-size:12px;font-weight:800;color:var(--ink);margin:0 0 6px;}
.field-input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;margin-bottom:14px;outline:none;background:#fff;}
.flag-row{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:13px;color:var(--ink);line-height:1.4;}
.flag-row input{margin-top:3px;flex-shrink:0;}

.triage-card{border-radius:16px;padding:16px;margin-top:14px;}
.triage-card.home{background:var(--sage-light);color:var(--sage-dark);}
.triage-card.call{background:#FFF3D6;color:#8A6116;}
.triage-card.emergency{background:#FBE3E1;color:#9B2C2C;}
.triage-title{font-weight:800;font-size:15px;margin:0 0 4px;}
.triage-detail{font-size:13px;line-height:1.5;margin:0;}

.topic-detail-block{margin-bottom:16px;}
.topic-detail-block:last-child{margin-bottom:0;}
.topic-detail-label{font-size:11px;font-weight:800;margin:0 0 8px;}
.topic-detail-list{margin:0;padding-left:18px;font-size:14px;line-height:1.6;color:var(--ink);}
.topic-detail-list li{margin-bottom:6px;}
.topic-detail-list li:last-child{margin-bottom:0;}

.disclaimer{font-size:11px;text-align:center;color:var(--muted);line-height:1.6;padding-top:8px;}

.pill-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
.pill{flex-shrink:0;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:800;white-space:nowrap;background:var(--sage-light);color:var(--sage);}
.pill.active{background:var(--sage);color:#fff;}

.week-dot{flex-shrink:0;width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;border:2px solid var(--line);background:#fff;color:var(--muted);}
.week-dot.active{background:var(--sage);color:#fff;border-color:var(--sage);}
.week-dot.done{background:var(--sage-light);color:var(--sage-dark);border-color:var(--sage-light);}

.stage-hero{border-radius:24px;padding:24px;text-align:center;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid var(--line);}
.stage-hero-emoji{font-size:44px;margin-bottom:8px;}
.stage-hero-title{font-family:Georgia,serif;font-size:24px;font-weight:600;color:var(--sage-dark);margin:0;}
.stage-hero-sub{font-size:14px;color:var(--muted);margin:6px 0 0;}

.detail-block{margin-bottom:16px;}
.detail-block:last-child{margin-bottom:0;}
.detail-label{font-size:11px;font-weight:800;color:var(--sage);margin:0 0 4px;}
.detail-text{font-size:14px;line-height:1.6;color:var(--ink);margin:0;}

.outline-btn{width:100%;padding:12px;border-radius:999px;font-weight:800;font-size:14px;border:2px solid var(--sage);color:var(--sage);background:#fff;}
.outline-btn.on{background:var(--sage);color:#fff;}

.check-row{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:10px;border-radius:12px;}
.check-row.on{background:var(--sage-light);}
.check-box{width:20px;height:20px;border-radius:6px;border:2px solid #D8E3DB;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0;}
.check-box.on{background:var(--sage);border-color:var(--sage);}
.check-text{font-size:14px;color:var(--ink);}
.cat-title{font-weight:800;font-size:14px;margin:0 0 12px;display:flex;align-items:center;gap:8px;color:var(--ink);}

.product-row{display:flex;gap:12px;align-items:center;}
.product-icon{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--blush);flex-shrink:0;}
.product-name{font-weight:800;font-size:14px;margin:0;color:var(--ink);}
.product-why{font-size:12px;line-height:1.4;color:var(--muted);margin:2px 0 0;}
.product-price{font-size:12px;font-weight:800;color:var(--sage-dark);margin:0 0 6px;text-align:right;}
.view-btn{font-size:11px;font-weight:800;padding:6px 12px;border-radius:999px;color:#fff;background:var(--sage);}

.chat-wrap{display:flex;flex-direction:column;min-height:70vh;padding:20px;}
.chat-disclaimer{border-radius:16px;padding:12px;font-size:12px;line-height:1.5;background:var(--blush);color:var(--blush-dark);margin-bottom:16px;}
.chat-messages{flex:1;display:flex;flex-direction:column;gap:12px;margin-bottom:16px;overflow-y:auto;}
.msg{display:flex;}
.msg.user{justify-content:flex-end;}
.msg.bot{justify-content:flex-start;}
.bubble{max-width:80%;border-radius:16px;padding:10px 14px;font-size:14px;line-height:1.5;}
.bubble.user{background:var(--sage);color:#fff;}
.bubble.bot{background:#fff;border:1px solid var(--line);color:var(--ink);}
.chat-input-row{position:sticky;bottom:8px;display:flex;gap:8px;background:var(--bg);padding-top:8px;}
.chat-input{flex:1;border-radius:999px;padding:10px 16px;font-size:14px;border:1px solid var(--line);outline:none;}
.chat-send{width:40px;height:40px;border-radius:999px;background:var(--sage);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;}

.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:50;pointer-events:none;}
.toast-inner{background:var(--ink);color:#fff;font-size:14px;font-weight:700;padding:10px 18px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.15);}

.reset-note{text-align:center;font-size:10px;color:#C9BEB2;padding:8px 0;}

.onboard-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:40px 24px;background:linear-gradient(180deg,var(--sage-light) 0%,var(--bg) 55%);}
.onboard-header{text-align:center;margin-bottom:32px;}
.onboard-logo{font-size:48px;margin-bottom:12px;}
.onboard-title{font-family:Georgia,serif;font-size:30px;font-weight:600;color:var(--sage-dark);margin:0;}
.onboard-sub{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.5;}
.choice-heading{text-align:center;font-weight:800;font-size:14px;margin-bottom:14px;color:var(--ink);}
.choice-btn{width:100%;background:#fff;border-radius:16px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid var(--line);text-align:left;display:flex;align-items:center;gap:16px;margin-bottom:12px;}
.choice-emoji{font-size:30px;}
.choice-title{display:block;font-weight:800;color:var(--ink);}
.choice-sub{display:block;font-size:12px;color:var(--muted);margin-top:2px;}
.back-btn{font-size:12px;font-weight:800;color:var(--sage);margin-bottom:16px;display:inline-block;}
.slider-card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid var(--line);}
.field-label{font-weight:800;font-size:13px;margin:0 0 4px;color:var(--ink);}
.field-sub{font-size:11px;color:var(--muted);margin:0 0 20px;}
.slider-label{text-align:center;margin-bottom:16px;}
.slider-value{font-family:Georgia,serif;font-size:36px;font-weight:600;color:var(--sage-dark);}
input[type=range]{width:100%;accent-color:#3F6D4E;height:20px;}
.range-caption{display:flex;justify-content:space-between;font-size:10px;font-weight:800;color:var(--muted);margin-top:4px;}
.primary-btn{width:100%;color:#fff;font-weight:800;padding:14px;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.04);background:var(--sage);margin-top:20px;font-size:15px;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.modal-sheet{width:100%;max-width:480px;background:#fff;border-radius:24px 24px 0 0;padding:24px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-title{font-weight:800;font-size:18px;color:var(--ink);margin:0;}
.modal-close{font-size:14px;font-weight:800;color:var(--muted);}
</style>

function feverTriage(ageMonths, tempF, flags){
  if (flags && flags.length > 0){
    return {level:'emergency', title:"Seek emergency care now", detail:"Call 911 (or your local emergency number) or go to the nearest ER. The symptoms you selected — like breathing trouble, a rash that doesn't fade, or difficulty waking — can signal something serious and shouldn't wait."};
  }
  if (tempF == null || isNaN(tempF)){
    return null;
  }
  if (tempF < 100.4){
    return {level:'home', title:"No fever detected right now", detail:"Keep monitoring — babies' temperatures can change quickly. Recheck in a few hours or sooner if new symptoms appear."};
  }
  if (ageMonths == null || isNaN(ageMonths)) ageMonths = 2;
  if (ageMonths < 3){
    return {level:'emergency', title:"Seek care right away", detail:"Any fever of 100.4°F (38°C) or higher in a baby under 3 months old needs immediate medical attention — call your pediatrician or go to the ER now, even if baby otherwise seems okay."};
  }
  if (ageMonths < 6){
    if (tempF >= 102) return {level:'call', title:"Call your pediatrician today", detail:"A fever of 102°F or higher at this age is worth a same-day call."};
    return {level:'call', title:"Consider calling your pediatrician", detail:"At this age, it's reasonable to call about any fever, especially if it lasts more than a few hours or baby seems unwell."};
  }
  if (tempF >= 104){
    return {level:'emergency', title:"Seek care right away", detail:"A fever of 104°F (40°C) or higher warrants prompt medical attention — call your pediatrician now or go to urgent care/the ER."};
  }
  if (tempF >= 102){
    return {level:'call', title:"Call your pediatrician today", detail:"Especially if baby seems uncomfortable, isn't drinking well, or the fever lasts more than a day."};
  }
  return {level:'home', title:"Usually manageable at home for now", detail:"Keep baby comfortable and hydrated. Call your pediatrician if the fever lasts more than 2-3 days, climbs higher, or baby seems increasingly unwell."};
}

    }).join('');

  }

      '<input class="chat-input" id="chatInput" placeholder="Ask about sleep, feeding, milestones..." onkeydown="if(event.key===\'Enter\'){chatSend();}" />' +

/* ============================== RENDER + ACTIONS ============================== */

function render(){
  var root = document.getElementById('root');
  if (!state.mode){
    root.innerHTML = onboardingView();
    return;
  }
  if (state.viewValue == null) state.viewValue = state.value;
  var body = '';
  if (state.tab==='home') body = homeView();
  else if (state.tab==='track') body = trackView();
  else if (state.tab==='learn') body = learnView();
  else if (state.tab==='act') body = actView();
  else if (state.tab==='health') body = healthView();
  else if (state.tab==='ask') body = askView();

  root.innerHTML =
    '<div class="app-shell">' +
      headerView() +
      '<div class="tab-body">' + body + '</div>' +
      bottomNavView() +
      '<p class="reset-note">Prototype note: your data resets if you reload this page.</p>' +
    '</div>' +
    (state.showSwitcher ? switcherView() : '') +
    '<div id="toast" class="toast"></div>';

  if (state.tab==='ask') scrollChatToBottom();
}

function scrollChatToBottom(){
  var c = document.getElementById('chatMessages');
  if (c) c.scrollTop = c.scrollHeight;
}

function showToast(msg){
  var t = document.getElementById('toast');
  if (!t) return;
  t.innerHTML = '<div class="toast-inner">' + escapeHtml(msg) + '</div>';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(function(){ t.innerHTML=''; }, 1800);
}

function chatSend(){
  var input = document.getElementById('chatInput');
  if (!input) return;
  var text = input.value.trim();
  if (!text) return;
  var reply = getChatResponse(text, state.mode, state.value);
  state.chatMessages.push({from:'user', text:text});
  state.chatMessages.push({from:'bot', text:reply});
  render();
}

function handleAction(act, arg){
  if (act==='choose-mode'){ obMode = arg; obValue = arg==='pregnancy' ? 12 : 2; render(); }
  else if (act==='onboard-back'){ obMode = null; render(); }
  else if (act==='start-journey'){
    var range = document.getElementById('obRange');
    var v = range ? Number(range.value) : obValue;
    state.mode = obMode;
    state.value = obMode==='pregnancy' ? Math.max(1, v) : v;
    state.viewValue = state.value;
    render();
  }
  else if (act==='set-tab'){ state.tab = arg; if (arg==='track') state.viewValue = state.value; render(); }
  else if (act==='open-switcher'){ swMode = state.mode; swValue = state.value; state.showSwitcher = true; render(); }
  else if (act==='close-switcher'){ state.showSwitcher = false; render(); }
  else if (act==='switcher-mode'){ swMode = arg; swValue = arg==='pregnancy' ? 12 : 2; render(); }
  else if (act==='save-switcher'){
    var range2 = document.getElementById('swRange');
    var v2 = range2 ? Number(range2.value) : swValue;
    state.mode = swMode;
    state.value = swMode==='pregnancy' ? Math.max(1, v2) : v2;
    state.viewValue = state.value;
    state.showSwitcher = false;
    render();
  }
  else if (act==='toggle-tracked'){ var w = Number(arg); state.tracked[w] = !state.tracked[w]; render(); }
  else if (act==='set-view'){ state.viewValue = Number(arg); render(); }
  else if (act==='toggle-check'){ state.checks[arg] = !state.checks[arg]; render(); }
  else if (act==='toggle-saved'){
    var idx = Number(arg);
    var feed = getGuidanceFeed(state.mode, state.value);
    var title = feed[idx].title;
    state.saved[title] = !state.saved[title];
    render();
  }
  else if (act==='set-filter'){ state.learnFilter = arg; render(); }
  else if (act==='view-product'){ showToast(decodeURIComponent(arg) + ' — added to your list ✓'); }
  else if (act==='chat-send'){ chatSend(); }
  else if (act==='select-health-topic'){ state.healthTopic = arg; render(); }
  else if (act==='health-back'){ state.healthTopic = null; render(); }
  else if (act==='check-fever'){
    var ageInput = document.getElementById('feverAge');
    var tempInput = document.getElementById('feverTemp');
    var ageVal = ageInput && ageInput.value !== '' ? Number(ageInput.value) : null;
    var tempVal = tempInput && tempInput.value !== '' ? Number(tempInput.value) : null;
    var flags = [];
    var flagsObj = {};
    FEVER_FLAGS.forEach(function(f){
      var cb = document.getElementById('flag_' + f.key);
      if (cb && cb.checked) { flags.push(f.key); flagsObj[f.key] = true; }
    });
    state.feverAge = ageVal;
    state.feverTemp = tempInput ? tempInput.value : '';
    state.feverFlags = flagsObj;
    state.feverResult = feverTriage(ageVal, tempVal, flags);
    if (!state.feverResult){
      showToast('Enter a temperature to get guidance');
    } else {
      render();
    }
  }
}

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el) return;
  handleAction(el.getAttribute('data-act'), el.getAttribute('data-arg'));
});

render();
</script>
</body>
</html>
